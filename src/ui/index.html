<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src http: https: data:">
<title>Superbrowser</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<aside id="side">
  <div class="drag"></div>
  <div id="tabs">
    <div id="tablist"></div>
    <button id="newtab" type="button" title="New Tab ⌘T"><span class="nt-ic" data-icon="plus"></span>New Tab</button>
  </div>
  <section class="sec" id="sec-bookmarks">
    <button class="sec-h" title="Bookmarks ⌥⌘B" aria-expanded="false"><span class="sec-a" data-icon="chevron"></span>Bookmarks</button>
    <div class="sec-b">
      <input class="sec-search" type="search" spellcheck="false" autocomplete="off" placeholder="Search bookmarks">
      <div class="sec-list"></div>
    </div>
  </section>
  <section class="sec" id="sec-history">
    <button class="sec-h" title="History ⌘Y" aria-expanded="false"><span class="sec-a" data-icon="chevron"></span>History</button>
    <div class="sec-b">
      <input class="sec-search" type="search" spellcheck="false" autocomplete="off" placeholder="Search history">
      <div class="sec-list"></div>
    </div>
  </section>
  <section id="downloads" hidden>
    <div class="dl-h">Downloads</div>
    <div id="dllist"></div>
  </section>
</aside>
<footer id="bar">
  <button id="toggle" title="Show/hide sidebar ⌘S" aria-label="Show or hide sidebar" data-icon="sidebar"></button>
  <div id="profiles"></div>
  <button id="addprofile" title="Import or Create Profile" aria-label="Import or create profile" data-icon="plus"></button>
  <div id="pins"></div>
</footer>
<script src="ui.js"></script>
</body>
</html>
