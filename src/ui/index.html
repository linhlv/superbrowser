<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src http: https: data:">
<title>Superbrowser</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<aside id="side">
  <div class="drag"></div>
  <div id="tabs">
    <div id="tablist"></div>
    <div id="newtab">+  New Tab</div>
  </div>
  <section class="sec" id="sec-bookmarks">
    <button class="sec-h" title="Bookmarks ⌥⌘B"><span class="sec-a">▸</span>Bookmarks</button>
    <div class="sec-b">
      <input class="sec-search" type="search" spellcheck="false" autocomplete="off" placeholder="Search bookmarks">
      <div class="sec-list"></div>
    </div>
  </section>
  <section class="sec" id="sec-history">
    <button class="sec-h" title="History ⌘Y"><span class="sec-a">▸</span>History</button>
    <div class="sec-b">
      <input class="sec-search" type="search" spellcheck="false" autocomplete="off" placeholder="Search history">
      <div class="sec-list"></div>
    </div>
  </section>
  <section id="downloads" hidden>
    <div class="dl-h">Downloads</div>
    <div id="dllist"></div>
  </section>
</aside>
<footer id="bar">
  <button id="toggle" title="Show/hide sidebar ⌘S">◧</button>
  <div id="profiles"></div>
  <button id="addprofile" title="Import or Create Profile">+</button>
  <div id="pins"></div>
</footer>
<script src="ui.js"></script>
</body>
</html>
